[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "precision-kvm"
version = "0.6.0"
description = "Low latency Windows to macOS keyboard and mouse sharing"
requires-python = ">=3.9"
dependencies = ["cryptography>=42", "Pillow>=10", "zeroconf>=0.130"]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Ahmed Shahriar"}]

[project.urls]
Homepage = "https://github.com/shahriar0247/precision-kvm"
Issues = "https://github.com/shahriar0247/precision-kvm/issues"
Releases = "https://github.com/shahriar0247/precision-kvm/releases"

[project.optional-dependencies]
mac = ["pyobjc-framework-Quartz>=10", "pyobjc-framework-Cocoa>=10"]
ui = ["pystray>=0.19"]
dev = ["pytest>=8", "ruff", "mypy", "build"]

[project.scripts]
precision-kvm = "precision_kvm.__main__:main"

[tool.setuptools.packages.find]
include = ["precision_kvm*"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
