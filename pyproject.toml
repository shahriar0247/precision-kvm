[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "precision-kvm"
version = "0.1.0"
description = "Low latency Windows to macOS keyboard and mouse sharing"
requires-python = ">=3.9"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
mac = ["pyobjc-framework-Quartz>=10", "pyobjc-framework-Cocoa>=10"]
dev = ["pytest>=8", "ruff", "mypy", "build"]

[project.scripts]
precision-kvm = "precision_kvm.__main__:main"

[tool.setuptools.packages.find]
include = ["precision_kvm*"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
